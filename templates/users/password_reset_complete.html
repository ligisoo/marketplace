{% extends 'base.html' %}

{% block title %}Password Reset Complete - Ligisoo{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-6">
    <div class="bg-card border border-border rounded-2xl shadow-xl p-6 sm:p-8 text-center">
        <div class="w-16 h-16 bg-green-500/10 text-green-500 rounded-full flex items-center justify-center mx-auto mb-4">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
            </svg>
        </div>

        <h1 class="text-2xl font-bold text-foreground mb-2">Password Changed!</h1>
        <p class="text-muted-foreground text-sm mb-6">
            Your password has been reset successfully. You can now sign in using your new password.
        </p>

        <a href="{% url 'users:login' %}" class="btn btn-primary px-6 py-3 rounded-xl font-bold block text-center w-full text-sm shadow-md">
            Sign In Now
        </a>
    </div>
</div>
{% endblock %}
